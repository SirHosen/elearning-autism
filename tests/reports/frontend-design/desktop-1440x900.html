<!DOCTYPE html>
<html lang="id" data-theme="calm" data-font-scale="normal" data-motion="minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Sahabat Belajar SLB B-C Wijayakusumah</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
  <link rel="stylesheet" href="/css/auth.css?v=1795586790">
  </head>
<body class="auth-body">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <main id="main-content" class="auth-stage">
    <a href="http://localhost:8000/masuk" class="auth-site-brand">
      <span class="auth-site-brand__name">Sahabat Belajar</span>
      <span class="auth-site-brand__sep" aria-hidden="true"></span>
      <span class="auth-site-brand__school">SLB B-C Wijayakusumah</span>
    </a>

    <div class="role-wrap">
  <div class="role-header">
    <h1 class="role-header__title">Selamat Datang</h1>
    <p class="role-header__desc">Pilih masuk sebagai murid atau guru.</p>
  </div>

  <div class="role-grid">
    <a href="http://localhost:8000/masuk/siswa" class="role-card role-card--student">
      <div class="role-card__cover">
        <span class="role-card__tag">Murid</span>
      </div>
      <div class="role-card__body">
        <h2 class="role-card__title">Saya Siswa</h2>
        <p class="role-card__desc">Masuk dengan nama pengguna dan angka PIN.</p>
        <div class="role-card__btn">
          <span>Masuk Murid</span>
          <span aria-hidden="true">&rarr;</span>
        </div>
      </div>
    </a>

    <a href="http://localhost:8000/masuk/guru" class="role-card role-card--teacher">
      <div class="role-card__cover">
        <span class="role-card__tag">Guru</span>
      </div>
      <div class="role-card__body">
        <h2 class="role-card__title">Saya Guru</h2>
        <p class="role-card__desc">Masuk dengan email dan kata sandi.</p>
        <div class="role-card__btn">
          <span>Masuk Guru</span>
          <span aria-hidden="true">&rarr;</span>
        </div>
      </div>
    </a>
  </div>
</div>
  </main>

  <footer class="auth-footer">
    <span>SLB B-C Wijayakusumah Sumedang</span>
  </footer>

  </body>
</html>
