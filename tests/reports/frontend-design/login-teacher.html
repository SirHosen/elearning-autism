<!DOCTYPE html>
<html lang="id" data-theme="calm" data-font-scale="normal" data-motion="minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Guru | Sahabat Belajar</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
  <link rel="stylesheet" href="/css/auth.css?v=1795587362">
  </head>
<body class="auth-body">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <main id="main-content" class="auth-stage">
    <a href="http://localhost:8000/masuk" class="auth-site-brand">
      <span class="auth-site-brand__name">Sahabat Belajar</span>
      <span class="auth-site-brand__sep" aria-hidden="true"></span>
      <span class="auth-site-brand__school">SLB B-C Wijayakusumah</span>
    </a>

    <div class="login-wrap">
  <a href="http://localhost:8000/masuk" class="login-back">
    <span aria-hidden="true">&larr;</span>
    <span>Kembali</span>
  </a>

  <div class="login-card">
    <div class="login-card__accent login-card__accent--green"></div>

    <div class="login-card__head">
      <span class="login-role-pill login-role-pill--green">Guru</span>
      <h1 class="login-card__title">Masuk Guru</h1>
      <p class="login-card__desc">Silakan masuk dengan email dan kata sandi Anda.</p>
    </div>

    
    <form action="http://localhost:8000/masuk/guru" method="POST" class="login-form">
      <input type="hidden" name="_token" value="" autocomplete="off">
      <div class="login-field">
        <label for="email" class="login-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          value=""
          required
          autofocus
          autocomplete="email"
          placeholder="guru@slb.test"
          class="login-input login-input--green "
                  >
              </div>

      <div class="login-field">
        <label for="password" class="login-label">Kata Sandi</label>
        <div class="login-input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Masukkan kata sandi"
            class="login-input login-input--green login-input--with-toggle "
                      >
          <button type="button" id="togglePassword" class="login-pw-toggle" aria-pressed="false" aria-label="Tampilkan atau sembunyikan kata sandi">
            Lihat
          </button>
        </div>
              </div>

      <div>
        <label for="remember" class="login-check-label">
          <input type="checkbox" id="remember" name="remember">
          <span>Ingat saya</span>
        </label>
      </div>

      <button type="submit" class="login-submit login-submit--green">
        <span>Masuk</span>
        <span aria-hidden="true">&rarr;</span>
      </button>
    </form>
  </div>

  <p class="login-switch-alt">
    Bukan guru? <a href="http://localhost:8000/masuk/siswa">Masuk sebagai murid</a>
  </p>
</div>
  </main>

  <footer class="auth-footer">
    <span>SLB B-C Wijayakusumah Sumedang</span>
  </footer>

  <script>
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');

  if (passwordInput && toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggleBtn.textContent = showing ? 'Lihat' : 'Tutup';
      toggleBtn.setAttribute('aria-pressed', showing ? 'false' : 'true');
    });
  }
</script>
</body>
</html>
