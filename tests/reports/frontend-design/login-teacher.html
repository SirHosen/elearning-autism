<!DOCTYPE html>
<html lang="id" data-theme="calm" data-font-scale="normal" data-motion="minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Panel Guru | EduAutis SLB B-C Wijayakusumah</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
  </head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg); color: var(--text);">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  
  <header class="guest-header">
    <div class="guest-header__inner">
      <a href="http://localhost:8000/masuk" class="guest-brand">
        <div class="guest-brand__mark">E</div>
        <div class="guest-brand__text">
          <span class="guest-brand__name">EduAutis</span>
          <span class="guest-brand__org">SLB B-C Wijayakusumah</span>
        </div>
      </a>
      <div class="guest-status">
        <span class="guest-status__dot"></span>
        <span class="guest-status__label hide-mobile">Desain Ramah Sensori</span>
      </div>
    </div>
  </header>

  
  <main id="main-content" class="guest-main">
    <div class="lt-container">

  
  <div class="lt-back-wrapper">
    <a href="http://localhost:8000/masuk" class="lt-back-link">
      <span class="lt-arrow">&larr;</span>
      <span>Pilih Peran Lain</span>
    </a>
  </div>

  
  <div class="lt-card">
    
    <div class="lt-accent-bar"></div>

    
    <div class="lt-header">
      <div class="lt-monogram">G</div>
      <h1 class="lt-title">Masuk Panel Guru</h1>
      <p class="lt-subtitle">Kelola materi, kuis, absensi, dan rapor siswa</p>
    </div>

    
    
    
    <form action="http://localhost:8000/masuk/guru" method="POST" class="lt-form">
      <input type="hidden" name="_token" value="" autocomplete="off">
      
      <div class="lt-field">
        <label for="email" class="lt-label">Alamat Email</label>
        <input type="email" id="email" name="email" value="" required autofocus
               placeholder="guru@slb.test"
               class="lt-input ">
              </div>

      
      <div class="lt-field">
        <label for="password" class="lt-label">Kata Sandi</label>
        <input type="password" id="password" name="password" required
               placeholder="Masukkan kata sandi..."
               class="lt-input ">
              </div>

      
      <div class="lt-remember-row">
        <label class="lt-checkbox-label">
          <input type="checkbox" id="remember" name="remember" class="lt-checkbox">
          <span>Ingat sesi di perangkat ini</span>
        </label>
      </div>

      
      <button type="submit" class="lt-submit-btn">
        <span>Masuk ke Panel Guru</span>
        <span class="lt-submit-arrow">&rarr;</span>
      </button>
    </form>

    
    <div class="lt-footer">
      <a href="http://localhost:8000/masuk/siswa" class="lt-switch-link">
        &larr; Beralih ke Masuk Siswa
      </a>
    </div>
  </div>
</div>

<style>
/* ══════════════ TAMPILAN MODERN MASUK GURU (ZERO EMOJI) ══════════════ */
.lt-container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
}

/* Navigasi Kembali */
.lt-back-wrapper {
  margin-bottom: 18px;
}
.lt-back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-soft, #4B5563);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 600;
  transition: color 0.15s ease, transform 0.15s ease;
}
.lt-back-link:hover {
  color: var(--ink, #1F2933);
  transform: translateX(-2px);
}
.lt-arrow {
  font-size: 1.125rem;
  line-height: 1;
}

/* Kartu Utama */
.lt-card {
  position: relative;
  background: var(--surface, #FFFFFF);
  border: 1.5px solid var(--line, #D9D2C5);
  border-radius: 18px;
  padding: 36px 32px 30px;
  box-shadow: 0 4px 20px rgba(31, 41, 51, 0.06);
  overflow: hidden;
}

/* Garis Aksen Hijau Emerald di Atas */
.lt-accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--success, #246B4D);
}

/* Header Kartu */
.lt-header {
  text-align: center;
  margin-bottom: 28px;
}
.lt-monogram {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--success-bg, #E3F2EA);
  border: 1.5px solid rgba(36, 107, 77, 0.25);
  color: var(--success, #246B4D);
  font-size: 1.625rem;
  font-weight: 800;
  line-height: 1;
  display: grid;
  place-items: center;
  margin: 0 auto 14px auto;
}
.lt-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--ink, #1F2933);
  margin: 0 0 6px 0;
  letter-spacing: -0.3px;
  line-height: 1.25;
}
.lt-subtitle {
  color: var(--ink-soft, #4B5563);
  font-size: 0.9375rem;
  margin: 0;
  line-height: 1.5;
}

/* Kotak Peringatan / Error */
.lt-alert {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--hint-bg, #FFF4DB);
  border: 1px solid var(--hint-line, #C99A2E);
  color: #92400E;
  font-size: 0.875rem;
  font-weight: 600;
  margin-bottom: 22px;
  text-align: left;
}
.lt-alert-badge {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #D97706;
  color: #FFFFFF;
  font-size: 0.75rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

/* Form Fields */
.lt-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  text-align: left;
}
.lt-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.lt-label {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--ink, #1F2933);
  letter-spacing: -0.1px;
}
.lt-input {
  width: 100%;
  min-height: 48px;
  padding: 0 16px;
  font-size: 0.9375rem;
  color: var(--ink, #1F2933);
  background: var(--surface, #FFFFFF);
  border: 1.5px solid var(--line, #D9D2C5);
  border-radius: 10px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-sizing: border-box;
}
.lt-input:focus {
  outline: none;
  border-color: var(--success, #246B4D);
  box-shadow: 0 0 0 3px rgba(36, 107, 77, 0.18);
}
.lt-input.is-invalid {
  border-color: var(--danger, #B3261E);
}
.lt-error-text {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--danger, #B3261E);
}

/* Remember Me Checkbox */
.lt-remember-row {
  margin-top: -4px;
}
.lt-checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-size: 0.875rem;
  color: var(--ink-soft, #4B5563);
  font-weight: 500;
  user-select: none;
}
.lt-checkbox {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  accent-color: var(--success, #246B4D);
  cursor: pointer;
}

/* Tombol Submit */
.lt-submit-btn {
  width: 100%;
  min-height: 50px;
  padding: 0 20px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 10px;
  background: var(--success, #246B4D);
  color: #FFFFFF;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 2px 6px rgba(36, 107, 77, 0.2);
}
.lt-submit-btn:hover {
  background: #1C553D;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(36, 107, 77, 0.3);
}
.lt-submit-btn:active {
  transform: translateY(1px);
}
.lt-submit-arrow {
  font-size: 1.125rem;
  transition: transform 0.15s ease;
}
.lt-submit-btn:hover .lt-submit-arrow {
  transform: translateX(3px);
}

/* Link Bawah / Switch Role */
.lt-footer {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line, #D9D2C5);
  text-align: center;
}
.lt-switch-link {
  color: var(--primary, #2F6F9F);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.875rem;
  transition: color 0.15s ease;
}
.lt-switch-link:hover {
  color: var(--primary-strong, #25587F);
  text-decoration: underline;
}

@media (max-width: 480px) {
  .lt-card {
    padding: 28px 20px 24px;
    border-radius: 14px;
  }
}
</style>
  </main>

  
  <footer class="guest-footer">
    <p>&copy; 2026 SLB B-C Wijayakusumah Sumedang</p>
    <p class="guest-footer__sub">Platform Pembelajaran Inklusif &bull; WCAG 2.1 AA</p>
  </footer>

  <style>
    /* ── Header ── */
    .guest-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
    }
    .guest-header__inner {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Brand ── */
    .guest-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .guest-brand__mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 1.25rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      letter-spacing: -0.5px;
    }
    .guest-brand__name {
      display: block;
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      line-height: 1.2;
    }
    .guest-brand__org {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── Sensory Status ── */
    .guest-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--success-bg);
      border: 1px solid rgba(36, 107, 77, 0.15);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--success);
    }
    .guest-status__dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    /* ── Main ── */
    .guest-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 20px;
    }

    /* ── Footer ── */
    .guest-footer {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 18px 24px;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
    .guest-footer p { margin: 0; }
    .guest-footer__sub {
      font-size: 0.6875rem;
      opacity: 0.7;
      margin-top: 2px !important;
    }

    @media (max-width: 640px) {
      .hide-mobile { display: none; }
      .guest-main { padding: 32px 16px; }
    }
  </style>

  </body>
</html>
